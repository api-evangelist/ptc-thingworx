specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ptc-thingworx
providerId: ptc-thingworx
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - IoT
  - Industrial
  - Manufacturing
  - Rate Limiting
description: PTC ThingWorx is deployed per-customer (cloud or on-prem); rate limits depend on the platform
  sizing of the deployment rather than a public per-tenant policy. Public ThingWorx documentation is
  gated to authenticated PTC customers.
notes: ThingWorx support documentation returns 403 to anonymous fetch. No public per-second rate-limit
  numbers exist; throughput is governed by deployment sizing and licensed connected-asset count.
sources:
  - https://www.ptc.com/en/products/thingworx
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Deployment-sized throughput
    scope: deployment
    metric: varies
    limit: 'depends on platform sizing and licensed asset count'
policies:
  - name: Sizing-Based Throughput
    description: Throughput, concurrency, and event-processing limits are set by the platform sizing
      (CPU, memory, persistence provider) and the licensed connected-asset count rather than a fixed
      public rate-limit table.
  - name: Customer Documentation
    description: Detailed operational thresholds live in PTC's authenticated support portal and ThingWorx
      Help Center.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
