naftiko: 1.0.0-alpha2
info:
  label: PTC ThingWorx REST API — DataShapes
  description: 'PTC ThingWorx REST API — DataShapes. 1 operations. Lead operation: Get a data shape. Self-contained Naftiko
    capability covering one Ptc Thingworx business surface.'
  tags:
  - Ptc Thingworx
  - DataShapes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PTC_THINGWORX_API_KEY: PTC_THINGWORX_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-datashapes
    baseUri: https://{host}/Thingworx
    description: PTC ThingWorx REST API — DataShapes business capability. Self-contained, no shared references.
    resources:
    - name: DataShapes-dataShapeName
      path: /DataShapes/{dataShapeName}
      operations:
      - name: getdatashape
        method: GET
        description: Get a data shape
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dataShapeName
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.PTC_THINGWORX_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-datashapes-rest
    port: 8080
    description: REST adapter for PTC ThingWorx REST API — DataShapes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/datashapes/{datashapename}
      name: datashapes-datashapename
      description: REST surface for DataShapes-dataShapeName.
      operations:
      - method: GET
        name: getdatashape
        description: Get a data shape
        call: rest-datashapes.getdatashape
        with:
          dataShapeName: rest.dataShapeName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-datashapes-mcp
    port: 9090
    transport: http
    description: MCP adapter for PTC ThingWorx REST API — DataShapes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-data-shape
      description: Get a data shape
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-datashapes.getdatashape
      with:
        dataShapeName: tools.dataShapeName
      outputParameters:
      - type: object
        mapping: $.
