tags:
  - IoT
  - Industrial
  - Manufacturing
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for PTC ThingWorx — quote-based enterprise IoT platform license,
  not a metered API consumption surface.
notes: ThingWorx is licensed by deployment and connected-asset count under a contract; there is no public
  consumption-billing API.
sources:
  - https://www.ptc.com/en/products/thingworx
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: PTC Inc.
serviceCategory: Industrial IoT Platform
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: ThingWorx
  ServiceCategory: Industrial IoT Platform
  ProviderName: PTC
  PublisherName: PTC Inc.
  InvoiceIssuerName: PTC Inc.
  BillingCurrency: USD
meters:
  - name: platform_subscription
    unit: month
    aggregation: sum
  - name: connected_assets
    unit: asset
    aggregation: max
principles:
  - name: Visibility
    description: Cost visibility flows from the PTC subscription invoice plus the customer's own platform-sizing
      and connected-asset telemetry inside ThingWorx.
  - name: Allocation
    description: Allocate by line of business, plant / site, and asset family using ThingWorx's own modeling
      surface.
  - name: Optimization
    description: Right-size the deployment (CPU / memory / persistence provider), retire stale assets,
      and renegotiate the licensed asset count at renewal.
  - name: Accountability
    description: Spend is owned by the OT / digital-thread / smart-manufacturing program that signs
      the master license agreement.
